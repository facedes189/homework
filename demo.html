<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演示页 · 响应式实验室</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<style>
  /* 这是一个「被演示」的独立小页面，样式全部内联在自己身上，
     不带任何主站框架——这样它的排版只由自己的宽度决定，缩到多宽都不受外部干扰。*/
  :root {
    --blue: #0b5fa5;
    --red: #e1553c;
    --gold: #e8a91d;
    --green: #2f8f6b;
    --ink: #1b1b1f;
    --ink2: #5c6773;
    --ink3: #8b95a0;
    --line: #e9e3d8;
    --paper: #fffdf8;
    --card: #ffffff;
  }
  html[data-theme="dark"] {
    --blue: #63b3f0;
    --ink: #e9eff6;
    --ink2: #b9c6d4;
    --ink3: #8494a6;
    --line: rgba(255, 255, 255, .1);
    --paper: #0d1218;
    --card: #151d26;
  }
  * { box-sizing: border-box; }
  /* 被装进小框里预览时，滚动条会占掉十几个像素、还在边缘留一条深色，
     这里把它藏起来（不影响滚动） */
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { width: 0; height: 0; }
  body {
    margin: 0;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink2);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  a { color: inherit; text-decoration: none; }
  p { margin: 0; }

  /* 顶部栏：窄屏让导航横向滑动，宽屏全部排开 */
  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    background: var(--blue);
    color: #fff;
  }
  html[data-theme="dark"] .bar { background: linear-gradient(180deg, #17405f, #0f2c44); }
  .logo {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    color: #0b5fa5;
    display: grid;
    place-items: center;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 14px;
  }
  .bar b {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .08em;
    white-space: nowrap;
  }
  .nav {
    display: flex;
    gap: 2px;
    margin-left: auto;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 100%);
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav a {
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    color: rgba(255, 255, 255, .84);
    white-space: nowrap;
  }
  .nav a.on { background: rgba(255, 255, 255, .18); color: #fff; }

  .wrap { padding: 18px 16px 22px; }

  .hero {
    padding: 18px 18px 20px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: linear-gradient(150deg, #eef5fc 0%, #fdf8ef 100%);
  }
  html[data-theme="dark"] .hero { background: linear-gradient(150deg, #16202a, #141b23); }
  .eyebrow {
    font-size: 9.5px;
    letter-spacing: .28em;
    color: var(--blue);
    text-transform: uppercase;
  }
  .hero h1 {
    margin: 7px 0 7px;
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .hero p { font-size: 12.5px; max-width: 32em; }
  .btn {
    display: inline-block;
    margin-top: 13px;
    padding: 7px 17px;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    font-size: 12.5px;
    letter-spacing: .06em;
  }
  html[data-theme="dark"] .btn { color: #08131d; }

  .cols {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 18px;
    margin-top: 18px;
  }

  h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 10px;
    font-size: 14px;
    letter-spacing: .06em;
    color: var(--ink);
  }
  h2 i {
    font-style: normal;
    font-size: 9px;
    letter-spacing: .2em;
    color: var(--ink3);
  }

  /* 卡片网格：1 列 → 2 列 → 4 列 */
  .cards {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .045);
  }
  .thumb { height: 54px; position: relative; overflow: hidden; }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120px 60px at 82% 18%, rgba(255, 255, 255, .5), transparent 70%);
  }
  .t1 { background: linear-gradient(135deg, #7fb6e3, #2f6fa8); }
  .t2 { background: linear-gradient(135deg, #f3b98a, #d9663f); }
  .t3 { background: linear-gradient(135deg, #a9d8bf, #3f8f6c); }
  .t4 { background: linear-gradient(135deg, #f5d98a, #dfa521); }
  .card-txt { padding: 9px 11px 11px; }
  .card-txt b {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: .02em;
  }
  .card-txt span { font-size: 11.5px; color: var(--ink3); }

  /* 右栏：只有宽屏才出现 */
  .aside { display: none; }
  .note {
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--card), rgba(240, 180, 41, .06));
  }
  .note h3 {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: .16em;
    font-weight: 500;
    color: var(--ink3);
  }
  .note p {
    font-family: "Songti SC", "SimSun", Georgia, serif;
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--ink2);
  }
  .aside ul { margin: 14px 0 0; padding: 0; list-style: none; }
  .aside li {
    display: flex;
    justify-content: space-between;
    padding: 6px 2px;
    font-size: 11.5px;
    border-bottom: 1px dashed var(--line);
  }
  .aside li:last-child { border-bottom: 0; }
  .aside li b { color: var(--ink); font-weight: 600; }

  .foot {
    padding: 14px 16px 18px;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--ink3);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* 右下角的实时读数：宽度 + 命中的断点 */
  .badge {
    position: fixed;
    right: 8px;
    bottom: 8px;
    z-index: 9;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(11, 95, 165, .93);
    color: #fff;
    font-size: 11px;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 14px rgba(4, 44, 78, .28);
    pointer-events: none;
  }
  .badge em { font-style: normal; opacity: .72; }

  /* ---- 断点：这就是这一页要演示的东西 ---- */
  @media (min-width: 620px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero h1 { font-size: 24px; }
    .bar { padding: 12px 20px; }
    .wrap { padding: 22px 20px 26px; }
  }
  @media (min-width: 960px) {
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cols { grid-template-columns: minmax(0, 1fr) 186px; gap: 20px; }
    .aside { display: block; }
    .hero { padding: 22px 24px 24px; }
    .hero h1 { font-size: 27px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
  }
</style>
</head>
<body>

  <header class="bar">
    <div class="logo">f</div>
    <b>演示页</b>
    <nav class="nav">
      <a class="on" href="#">首页</a>
      <a href="#">相册</a>
      <a href="#">作品</a>
      <a href="#">关于</a>
    </nav>
  </header>

  <div class="wrap">
    <section class="hero">
      <p class="eyebrow">Demo Page</p>
      <h1>同一份代码，<br>换个宽度就换一种排法</h1>
      <p>我是一个被装进 iframe 的普通页面。我的 HTML 一行都没改过，只是容器变宽或变窄，下面的卡片就从一列变成两列、四列。</p>
      <a class="btn" href="#">随便看看</a>
    </section>

    <div class="cols">
      <main>
        <h2>四张卡片 <i>CARDS</i></h2>
        <div class="cards">
          <article class="card">
            <div class="thumb t1"></div>
            <div class="card-txt"><b>清晨</b><span>六点四十的操场</span></div>
          </article>
          <article class="card">
            <div class="thumb t2"></div>
            <div class="card-txt"><b>午后</b><span>图书馆靠窗的位置</span></div>
          </article>
          <article class="card">
            <div class="thumb t3"></div>
            <div class="card-txt"><b>傍晚</b><span>教学楼后面的小路</span></div>
          </article>
          <article class="card">
            <div class="thumb t4"></div>
            <div class="card-txt"><b>深夜</b><span>台灯下的一页书</span></div>
          </article>
        </div>
      </main>

      <aside class="aside">
        <div class="note">
          <h3>今日一句</h3>
          <p>“把每一件小事做好，日子就会慢慢亮起来。”</p>
        </div>
        <ul>
          <li><span>页面宽度</span><b id="side-w">—</b></li>
          <li><span>栅格列数</span><b id="side-col">—</b></li>
          <li><span>断点</span><b id="side-bp">—</b></li>
        </ul>
      </aside>
    </div>
  </div>

  <footer class="foot">
    <span>演示页 · 响应式实验室</span>
    <span>拖动宽度，看看我怎么变</span>
  </footer>

  <div class="badge"><b id="w">—</b><em>px</em><em>·</em><span id="bp">—</span></div>

  <script>
    (function () {
      'use strict';
      try {
        if (localStorage.getItem('faded_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}

      var wEl = document.getElementById('w');
      var bpEl = document.getElementById('bp');
      var swEl = document.getElementById('side-w');
      var scEl = document.getElementById('side-col');
      var sbEl = document.getElementById('side-bp');

      function readout() {
        var w = window.innerWidth;
        var bp = w < 620 ? '手机' : (w < 960 ? '平板' : '桌面');
        var col = w < 620 ? '1 列' : (w < 960 ? '2 列' : '4 列');
        if (wEl) wEl.textContent = w;
        if (bpEl) bpEl.textContent = bp;
        if (swEl) swEl.textContent = w + ' px';
        if (scEl) scEl.textContent = col;
        if (sbEl) sbEl.textContent = bp;
      }
      readout();
      window.addEventListener('resize', readout);
    })();
  </script>
</body>
</html>
